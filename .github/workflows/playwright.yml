name: Playwright Tests CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run E2E Tests on Chrome
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Test Scenarios Excel Matrix is up to date
        run: node generate-scenarios-xlsx.js

      - name: Install Google Chrome with System Dependencies
        run: npx playwright install --with-deps chrome

      - name: Run Playwright Tests (Headless Chrome)
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://magang.dikahadir.com' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@hadir.com' }}
          ADMIN_PASSWORD_BASE64: ${{ secrets.ADMIN_PASSWORD_BASE64 || 'TWFnYW5nU1FBX0pDQDEyMw==' }}
          CI: 'true'
          HEADLESS: 'true'
        run: npx playwright test

      - name: Upload Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Excel Test Scenarios Matrix
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-scenarios-matrix
          path: test-scenarios/Skenario_Test_Register_User.xlsx
          retention-days: 14
